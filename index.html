<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球人形机器人整机企业数据库</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB",sans-serif;background:#f0f2f5;color:#1a1a2e;line-height:1.5}
a{color:inherit;text-decoration:none}

/* ── Hero ── */
.hero{background:linear-gradient(135deg,#0b0b1a 0%,#1a1040 40%,#0d2137 100%);color:#fff;padding:32px 0 20px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60%;left:-20%;width:600px;height:600px;background:radial-gradient(circle,rgba(76,201,240,.08) 0%,transparent 70%);border-radius:50%}
.hero::after{content:'';position:absolute;bottom:-40%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(255,107,107,.06) 0%,transparent 70%);border-radius:50%}
.hero h1{font-size:2rem;font-weight:900;position:relative;z-index:1}
.hero .sub{font-size:.88rem;opacity:.55;margin-top:6px;position:relative;z-index:1}
.hero .totals{display:flex;justify-content:center;gap:36px;margin-top:18px;position:relative;z-index:1;flex-wrap:wrap}
.hero .totals .t{text-align:center}
.hero .totals .t .n{font-size:1.6rem;font-weight:800;color:#4cc9f0}
.hero .totals .t .l{font-size:.7rem;opacity:.5;display:block;margin-top:2px}

/* ── Container ── */
.container{max-width:1280px;margin:0 auto;padding:16px}

/* ── News Banner ── */
.news-section{background:#fff;border-radius:12px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.news-banner{background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);padding:18px 24px;position:relative;overflow:hidden}
.news-banner::before{content:'';position:absolute;top:-50%;right:-10%;width:300px;height:300px;background:radial-gradient(circle,rgba(255,107,107,.12) 0%,transparent 70%);border-radius:50%}
.news-banner .nc{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.news-banner .nc h2{font-size:1.3rem;font-weight:800;color:#fff}
.news-banner .nc .date-badge{background:rgba(255,255,255,.12);color:#fff;padding:5px 14px;border-radius:20px;font-size:.82rem;font-weight:600}
.news-banner .nc .date-badge .dot{display:inline-block;width:6px;height:6px;background:#51cf66;border-radius:50%;margin-right:7px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.news-carousel-wrap{padding:10px 24px 14px;position:relative}
.news-carousel{position:relative;height:160px;overflow:hidden}
.news-track{display:flex;transition:transform .5s ease;height:100%}
.news-slide{min-width:100%;padding:4px 0}
.news-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}
.news-item:hover{background:#f8f9ff}
.news-item:last-child{border-bottom:none}
.news-item .rnk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font-size:.7rem;font-weight:700;color:#fff;flex-shrink:0}
.rnk-1,.rnk-2,.rnk-3{background:#ff6b6b}
.rnk-4,.rnk-5{background:#ff922b}
.news-item .nc2{flex:1;min-width:0}
.news-item .nc2 .nt{font-size:.83rem;font-weight:600;color:#1a1a2e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news-item:hover .nc2 .nt{color:#1c7ed6;text-decoration:underline}
.news-item .nc2 .ni{font-size:.68rem;color:#999;margin-top:2px}
.news-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.news-dots .dot{width:7px;height:7px;border-radius:50%;background:#ddd;cursor:pointer;transition:all .2s}
.news-dots .dot.active{background:#ff6b6b;width:18px;border-radius:4px}
.news-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);color:#fff;border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;z-index:2;opacity:0;transition:opacity .2s}
.news-section:hover .news-nav{opacity:1}
.news-nav.prev{left:0px}.news-nav.next{right:0px}

/* ── Search Bar ── */
.search-bar{background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-bar input{flex:1;min-width:200px;padding:10px 16px;border:2px solid #e8e8ec;border-radius:8px;font-size:.92rem;transition:border-color .2s}
.search-bar input:focus{outline:none;border-color:#4cc9f0}
.search-bar select{padding:10px 14px;border:2px solid #e8e8ec;border-radius:8px;font-size:.88rem;background:#fff;cursor:pointer}
.search-bar select:focus{outline:none;border-color:#4cc9f0}
.search-bar .btn-reset{padding:10px 18px;border:none;border-radius:8px;background:#f0f2f5;color:#555;font-size:.85rem;cursor:pointer;font-weight:600;transition:all .15s}
.search-bar .btn-reset:hover{background:#e0e2e5}

/* ── Country Grid ── */
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.country-card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;transition:box-shadow .2s}
.country-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.country-card .cc-header{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;user-select:none;border-bottom:1px solid transparent;transition:border-color .2s}
.country-card.expanded .cc-header{border-bottom-color:#f0f0f0}
.country-card .cc-header .flag{font-size:2rem;line-height:1}
.country-card .cc-header .cc-info{flex:1}
.country-card .cc-header .cc-info .cc-name{font-size:1rem;font-weight:700}
.country-card .cc-header .cc-info .cc-count{font-size:.75rem;color:#888;margin-top:2px}
.country-card .cc-header .cc-arrow{font-size:.7rem;color:#bbb;transition:transform .3s}
.country-card.expanded .cc-header .cc-arrow{transform:rotate(180deg)}
.country-card .cc-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.country-card.expanded .cc-body{max-height:2000px}
.country-card .cc-body .cc-table{width:100%;border-collapse:collapse}
.country-card .cc-body .cc-table td{padding:8px 20px;font-size:.8rem;border-bottom:1px solid #f6f6f6}
.country-card .cc-body .cc-table tr:hover td{background:#f8f9ff}
.country-card .cc-body .cc-table .co-name{cursor:pointer;font-weight:600;color:#1c7ed6}
.country-card .cc-body .cc-table .co-name:hover{text-decoration:underline}
.country-card .cc-body .cc-table .co-city{color:#888}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:600}
.badge-mass{background:#51cf6620;color:#2b8a3e}
.badge-pilot{background:#ffd43b20;color:#e67700}
.badge-rd{background:#adb5bd20;color:#495057}

/* ── Detail Panel ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99}
.overlay.show{display:block}
.detail-panel{position:fixed;top:0;right:0;width:460px;max-width:100vw;height:100vh;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.15);z-index:100;overflow-y:auto;padding:28px 24px;transform:translateX(100%);transition:transform .3s ease}
.detail-panel.show{transform:translateX(0)}
.detail-panel .dp-close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:1.4rem;cursor:pointer;color:#999}
.detail-panel h3{font-size:1.1rem;margin-bottom:18px;padding-right:24px}
.detail-panel .dp-field{margin-bottom:14px}
.detail-panel .dp-field .dp-label{font-size:.72rem;color:#aaa;display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.detail-panel .dp-field .dp-val{font-size:.9rem;color:#1a1a2e}
.detail-panel .dp-field .dp-val a{color:#1c7ed6}

/* ── Footer ── */
.footer{text-align:center;padding:28px;color:#aaa;font-size:.75rem}

/* ── Responsive ── */
@media(max-width:768px){
  .country-grid{grid-template-columns:1fr}
  .hero h1{font-size:1.4rem}
  .hero .totals{gap:20px}
  .news-carousel{height:200px}
  .detail-panel{width:100%}
}

.flag-emoji{display:inline-block}
</style>
</head>
<body>

<div class="hero">
  <h1>🤖 全球人形机器人整机企业数据库</h1>
  <div class="sub">Humanoid Robot Manufacturers Worldwide · 覆盖20个国家 · 持续更新</div>
  <div class="totals">
    <div class="t"><span class="n" id="heroTotal">--</span><span class="l">企业总数</span></div>
    <div class="t"><span class="n" id="heroCountries">--</span><span class="l">覆盖国家</span></div>
    <div class="t"><span class="n" id="heroCN">--</span><span class="l">中国企业</span></div>
    <div class="t"><span class="n" id="heroUS">--</span><span class="l">美国企业</span></div>
  </div>
</div>

<div class="container">

  <!-- News -->
  <div class="news-section" id="newsSection">
    <div class="news-banner">
      <div class="nc">
        <h2>🔥 人形机器人 · 全球热点</h2>
        <div class="date-badge"><span class="dot"></span><span id="newsDate"></span></div>
      </div>
    </div>
    <div class="news-carousel-wrap">
      <div class="news-carousel" id="newsCarousel">
        <button class="news-nav prev" onclick="newsPrev()">‹</button>
        <button class="news-nav next" onclick="newsNext()">›</button>
        <div class="news-track" id="newsTrack"></div>
      </div>
      <div class="news-dots" id="newsDots"></div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="search" placeholder="🔍 搜索企业名 / 产品 / 城市 / 行业...">
    <select id="typeFilter">
      <option value="">全部形态</option>
      <option value="双足">双足人形</option>
      <option value="轮式">轮式双臂</option>
      <option value="四足">四足延伸</option>
      <option value="双臂">双臂协作</option>
    </select>
    <select id="stageFilter">
      <option value="">全部阶段</option>
      <option value="量产">量产</option>
      <option value="试点">试点</option>
      <option value="研发">研发</option>
    </select>
    <button class="btn-reset" onclick="resetFilters()">重置</button>
  </div>

  <!-- Country Sections -->
  <div class="country-grid" id="countryGrid"></div>

</div>

<div class="footer" id="footer"></div>

<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel"></div>

<script>
// ── Data ──
let companies=[],filtered=[],newsData=[],newsPage=0,newsAutoTimer=null;
const PAGE_ITEMS=5;

// ── Flags ──
const FLAGS={中国:'🇨🇳',美国:'🇺🇸',日本:'🇯🇵',韩国:'🇰🇷',德国:'🇩🇪',法国:'🇫🇷',英国:'🇬🇧',意大利:'🇮🇹',西班牙:'🇪🇸',瑞士:'🇨🇭',挪威:'🇳🇴',瑞典:'🇸🇪',波兰:'🇵🇱',加拿大:'🇨🇦',新加坡:'🇸🇬',印度:'🇮🇳',俄罗斯:'🇷🇺',以色列:'🇮🇱',阿联酋:'🇦🇪',沙特阿拉伯:'🇸🇦',埃及:'🇪🇬'};

function flag(c){return FLAGS[c]||'🌐'}

function stageBadge(s){
  if(s==='量产')return '<span class="badge badge-mass">量产</span>';
  if(s==='试点')return '<span class="badge badge-pilot">试点</span>';
  return '<span class="badge badge-rd">研发</span>';
}

// ── Render by Country ──
function renderCountries(){
  const grid=document.getElementById('countryGrid');
  const byCountry={};
  filtered.forEach(c=>{
    if(!byCountry[c.country]) byCountry[c.country]=[];
    byCountry[c.country].push(c);
  });
  const entries=Object.entries(byCountry).sort((a,b)=>b[1].length-a[1].length);
  grid.innerHTML=entries.map(([country,list])=>`
    <div class="country-card" data-country="${country}">
      <div class="cc-header" onclick="toggleCountry(this,'${country}')">
        <span class="flag-emoji">${flag(country)}</span>
        <div class="cc-info">
          <div class="cc-name">${country}</div>
          <div class="cc-count">${list.length} 家企业</div>
        </div>
        <span class="cc-arrow">▼</span>
      </div>
      <div class="cc-body">
        <table class="cc-table">
          ${list.map(c=>`<tr>
            <td><span class="co-name" onclick="event.stopPropagation();showDetail('${c.id}')">${c.name}</span></td>
            <td class="co-city">${c.city||'-'}</td>
            <td>${c.product||'-'}</td>
            <td>${stageBadge(c.stage)}</td>
          </tr>`).join('')}
        </table>
      </div>
    </div>
  `).join('');
  updateHero();
}

function toggleCountry(header, country){
  const card=header.closest('.country-card');
  card.classList.toggle('expanded');
}

function updateHero(){
  const uniqCountries=new Set(filtered.map(c=>c.country));
  document.getElementById('heroTotal').textContent=filtered.length;
  document.getElementById('heroCountries').textContent=uniqCountries.size;
  document.getElementById('heroCN').textContent=filtered.filter(c=>c.country==='中国').length;
  document.getElementById('heroUS').textContent=filtered.filter(c=>c.country==='美国').length;
  document.getElementById('footer').innerHTML=`数据持续更新中 · 最后更新: ${new Date().toISOString().slice(0,10)} · 企业总数: ${companies.length} 家 · 来源: 公开信息多源交叉验证`;
}

// ── Filter ──
function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  const tf=document.getElementById('typeFilter').value;
  const sf=document.getElementById('stageFilter').value;
  filtered=companies.filter(c=>{
    if(!c.name.toLowerCase().includes(q)&&!(c.product||'').toLowerCase().includes(q)&&!(c.city||'').toLowerCase().includes(q)&&!(c.sector||'').toLowerCase().includes(q)&&!(c.team_bg||'').toLowerCase().includes(q))return false;
    if(tf&&c.type!==tf)return false;
    if(sf&&c.stage!==sf)return false;
    return true;
  });
  renderCountries();
}

function resetFilters(){
  document.getElementById('search').value='';
  document.getElementById('typeFilter').value='';
  document.getElementById('stageFilter').value='';
  filtered=[...companies];
  renderCountries();
}

// ── Detail Panel ──
function showDetail(id){
  const c=companies.find(x=>x.id===id);
  if(!c)return;
  const labels={country:'国家',city:'城市',product:'代表产品',year:'成立年份',type:'形态',stage:'阶段',sector:'应用领域',team_bg:'团队背景',funding:'融资/估值',shipment:'2025出货量',website:'官网'};
  document.getElementById('detailPanel').innerHTML=`
    <button class="dp-close" onclick="closeDetail()">✕</button>
    <h3>${flag(c.country)} ${c.name}</h3>
    ${['country','city','product','year','type','stage','sector','team_bg','funding','shipment','website'].map(k=>c[k]?`<div class="dp-field"><span class="dp-label">${labels[k]||k}</span><span class="dp-val">${k==='website'?`<a href="${c[k]}" target="_blank">${c[k]}</a>`:c[k]}</span></div>`:'').join('')}
  `;
  document.getElementById('detailPanel').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closeDetail(){
  document.getElementById('detailPanel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ── News ──
function renderNews(){
  const track=document.getElementById('newsTrack');
  const dots=document.getElementById('newsDots');
  const items=[...newsData].sort((a,b)=>b.heat-a.heat);
  const pages=Math.ceil(items.length/PAGE_ITEMS);
  let slides=[];
  for(let p=0;p<pages;p++){
    const chunk=items.slice(p*PAGE_ITEMS,p*PAGE_ITEMS+PAGE_ITEMS);
    slides.push(chunk.map((n,i)=>{
      const rank=p*PAGE_ITEMS+i+1;
      const rcls=rank<=3?`rnk-${rank}`:(rank<=5?`rnk-${rank}`:'');
      return`<div class="news-item" onclick="window.open('${n.url}','_blank')"><span class="rnk ${rcls}" style="${rank>5?'background:#4cc9f0':''}">${rank}</span><div class="nc2"><div class="nt">${n.title}</div><div class="ni">${n.date} · ${n.source} · ${n.heat}°</div></div></div>`;
    }));
  }
  track.innerHTML=slides.map(s=>`<div class="news-slide">${s.join('')}</div>`).join('');
  dots.innerHTML=Array.from({length:pages},(_,i)=>`<span class="dot${i===0?' active':''}" onclick="newsGo(${i})"></span>`).join('');
  newsPage=0;updateSlide();startAutoPlay();
}
function updateSlide(){
  document.getElementById('newsTrack').style.transform=`translateX(-${newsPage*100}%)`;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===newsPage));
}
function newsGo(p){newsPage=p;updateSlide();startAutoPlay();}
function newsPrev(){newsPage=Math.max(0,newsPage-1);updateSlide();startAutoPlay();}
function newsNext(){const pages=Math.ceil(newsData.length/PAGE_ITEMS);newsPage=(newsPage+1)%pages;updateSlide();startAutoPlay();}
function startAutoPlay(){clearInterval(newsAutoTimer);newsAutoTimer=setInterval(()=>{const pages=Math.ceil(newsData.length/PAGE_ITEMS);newsPage=(newsPage+1)%pages;updateSlide();},5000);}

// ── Init ──
document.getElementById('search').addEventListener('input',applyFilters);
document.getElementById('typeFilter').addEventListener('change',applyFilters);
document.getElementById('stageFilter').addEventListener('change',applyFilters);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});

fetch('data/news.json').then(r=>r.json()).then(data=>{
  newsData=data;
  const now=new Date();
  document.getElementById('newsDate').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  renderNews();
}).catch(()=>{});

fetch('data/companies.json').then(r=>r.json()).then(data=>{
  companies=data.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  filtered=[...companies];
  renderCountries();
});
</script>
</body>
</html>
